<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>私がハマったゲームたち</title>

  <link rel="stylesheet" href="./dist/css/swiper.css">
  <link rel="stylesheet" href="./menu.css">
  <link rel="stylesheet" href="./common.css">
  <link rel="stylesheet" href="./home.css">
  <link rel="stylesheet" href="./transision.css">
</head>

<body id="top">

  <div class="start-screen" id="startScreen">
    <p class="start-text">PRESS START</p>
  </div>

  <main class="home-page">
    <section class="main-visual">
      <div class="line line1"></div>
      <div class="line line2"></div>
      <div class="line line3"></div>
      <div class="line line4"></div>
      <div class="line line5"></div>
      <div class="line line6"></div>
      <div class="line line7"></div>
      <div class="line line8"></div>
      <div class="line line9"></div>
      <div class="line line10"></div>

      <div class="top-area">
<nav class="nav-menu">
  <ul class="menu-list fancy-list">
    <li class="menu-item">
      <a href="Home.html">Home</a>
    </li>
    <li class="menu-item drop-menu">
      <a href="#">記事</a>
      <ul class="drop-menu-list">
        <li class="drop-menu-item">
          <a href="child-list.html">幼少期</a>
        </li>
        <li class="drop-menu-item">
          <a href="high-list.html">中高生期</a>
        </li>
      </ul>
    </li>
    <li class="menu-item">
      <a href="game-list.html">ゲーム一覧</a>
    </li>
  </ul>
</nav>

        <p class="web-title">
          <span id="webpro"></span>
        </p>
      </div>

      <div class="main-text">
        <h1 class="Tanugo">私がハマったゲームたち</h1>
      </div>

      <div class="switch">
        <div class="left-controller"></div>
        <div class="screen"></div>
        <div class="right-controller"></div>
      </div>
    </section>

    <section class="about">
      <div class="about-box">
        <p class="small-title">HOME</p>
        <h2>
        <span id="about-home"></span>
        </h2>
        <p class="Noto_Sans">こんにちは！飽き性なゲーム好きです。</p>
        <p class="Noto_Sans">今までにハマったゲームを紹介していこうと思います！</p>
        <p class="Noto_Sans">ホームメニューから記事をクリックしてください。</p>
      </div>

      <div class="swiper-container about-swiper">
        <div class="swiper-wrapper">
          <div class="swiper-slide">
            <img class="ss-image" src="./Images/Minecraft.jpeg" alt="Minecraft">
            <div class="slide-overlay"></div>
          </div>

          <div class="swiper-slide">
            <img class="ss-image" src="./Images/59.jpg" alt="メギド72">
            <div class="slide-overlay"></div>
          </div>

          <div class="swiper-slide">
            <img class="ss-image" src="./Images/SK.jpg" alt="Skyrim">
            <div class="slide-overlay"></div>
          </div>
        </div>

        <div class="swiper-pagination"></div>
        <div class="swiper-button-prev"></div>
        <div class="swiper-button-next"></div>
      </div>
    </section>

    <p class="back-top" style="display: none;">
    <a href="#top">↑</a>
</p>
    <div class="page-transition"></div>
  </main>

  <script src="./dist/js/swiper.js"></script>
  <script src="https://unpkg.com/typed.js@2.1.0/dist/typed.umd.js"></script>
  <script>

    document.getElementById('startScreen').addEventListener('click', function() {
      document.getElementById('startScreen').classList.add('hide');
      document.querySelector('.back-top').style.display = 'block';
    });

    var swiper = new Swiper('.swiper-container', {
      navigation: {
        nextEl: '.swiper-button-next',
        prevEl: '.swiper-button-prev',
      },
      pagination: {
        el: '.swiper-pagination',
        clickable: true,
      },
      loop: true,
      autoplay: {
        delay: 5000,
      },
      speed: 1500,
    });

    new Typed("#about-home", {
      strings: ["このサイトについて"],
      typeSpeed: 80,
      startDelay:1000,
      showCursor: true
    });

    new Typed("#webpro", {
      strings: ["Web Programming"],
      typeSpeed: 80,
      startDelay:1000,
      showCursor: true
    });
  </script>

  <script src="./transision.js"></script>
</body>
</html>
