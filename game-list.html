<script>

function init(){

    const canvas =
        document.getElementById("bg-canvas");

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    canvas.dataset.endpos = 0;

    setInterval(drawCanvasOnTimer, 20, canvas);
}

function drawCanvasOnTimer(obj){

    const ctx = obj.getContext("2d");

    ctx.clearRect(0, 0, obj.width, obj.height);

    let endpos =
        parseFloat(obj.dataset.endpos);

    ctx.lineWidth = 2;
ctx.strokeStyle = "rgba(12,103,177,0.3)";

const circles = [
    [100,100,30],
    [300,200,50],
    [600,150,40],
    [900,250,60],

    [200,500,45],
    [800,600,35],

    [1200,150,50],
    [1400,400,30],

    [500,700,55],
    [1000,750,40]
];

for(let i=0;i<circles.length;i++){

    ctx.beginPath();

    ctx.arc(
    circles[i][0],
    circles[i][1],
    circles[i][2],
    endpos,
    endpos + Math.PI,
    false
);

    ctx.stroke();
}

    const d_angle = Math.PI * 2 / 100;

        endpos += d_angle;

    obj.dataset.endpos = endpos;
}

window.onload = init;

</script>
